name: Refresh tender data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Fetch and score opportunities
        run: python scripts/fetch_tenders.py
      - name: Commit changed tender data
        run: |
          if git diff --quiet -- data/tenders.json data/status.json; then
            echo "No tender data changes"
            exit 0
          fi
          git config user.name "tender-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json data/status.json
          git commit -m "chore: refresh tender data"
          git push
