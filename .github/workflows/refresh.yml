name: Refresh tender data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '0 6,19 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Fetch and score opportunities
        run: python scripts/fetch_tenders_compat.py
      - name: Remove false acronym matches
        run: python scripts/filter_false_positives.py
      - name: Commit changed tender data
        run: |
          if git diff --quiet -- data/tenders.json data/status.json; then
            echo "No tender data changes"
            exit 0
          fi

          cp data/tenders.json /tmp/tenders.json
          cp data/status.json /tmp/status.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/tenders.json data/tenders.json
          cp /tmp/status.json data/status.json

          if git diff --quiet -- data/tenders.json data/status.json; then
            echo "No tender data changes after sync"
            exit 0
          fi

          git config user.name "tender-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json data/status.json
          git commit -m "chore: refresh tender data"
          git push origin HEAD:main
